<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TẬP SAN KỈ NIỆM 20 NĂM THPT NGUYỄN THƯỢNG HIỀN</title>
<style>
  html,body{height:100%;margin:0;font-family:Arial;background:#111;color:#fff;overflow:hidden}
  .viewer{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  /* NOTE: box-sizing để padding-bottom giảm đúng chiều cao khả dụng */
  .canvas-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-sizing:border-box}
  .spread{display:flex;align-items:center;justify-content:center;transition:transform 0.2s ease}
  canvas{display:block;background:#000;margin:0 2px;border-radius:4px}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.4);border-radius:40px;padding:12px;cursor:pointer;z-index:10}
  .arrow.left{left:20px} .arrow.right{right:20px}
  .page-ind{position:absolute;top:10px;right:20px;color:#bbb;font-size:14px}
  .controls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
  .btn{padding:6px 12px;border-radius:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);cursor:pointer;color:#fff}
  @media (max-width: 767px){ .controls, .arrow { display:none !important; } }
  #loadingOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity 0.6s ease;}
  #loadingOverlay.fade-out{opacity:0;pointer-events:none;}
  #loadingOverlay img{width:120px;margin-bottom:20px;}
  .loader{border:6px solid #333;border-top:6px solid #09f;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin-bottom:15px;}
  @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }
  .loading-text{font-size:18px;color:#ccc}
  .loading-dots::after{content:"";animation:dots 1.5s steps(3,end) infinite;}
  @keyframes dots{0%{content:"";}33%{content:".";}66%{content:"..";}100%{content:"...";}}

  /* --- Mobile navigation (fixed, không bị zoom/pan ảnh hưởng) --- */
  @media (max-width: 767px) {
    .mobile-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 9999;   /* luôn nổi trên cùng */
      align-items: center;
      flex-wrap: nowrap; /* không cho xuống hàng */
      pointer-events: auto;
    }
    .mobile-btn {
      padding: 12px 28px;
      border-radius: 10px;
      background: rgba(0,0,0,0.85);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      white-space: nowrap; /* KHÔNG wrap */
      min-width: 160px; /* đảm bảo chữ không xuống dòng */
      height: 56px;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    }
    .mobile-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ĐẶT khoảng trống bên dưới canvas để button không chồng lên page.
       Giá trị này sẽ được cập nhật động từ JS theo kích thước thực tế của mobile-nav,
       nhưng để an toàn đặt 100px làm fallback. */
    .canvas-wrap { padding-bottom: 100px; }
  }
</style>
</head>
<body>
  <div id="loadingOverlay">
    <img src="logo.png" alt="Logo">
    <div class="loader"></div>
    <div class="loading-text">Đang tải dữ liệu<span class="loading-dots"></span></div>
  </div>

  <div class="viewer">
    <div class="canvas-wrap" id="canvasWrap">
      <div class="spread" id="spread">
        <canvas id="pdfCanvasLeft"></canvas>
        <canvas id="pdfCanvasRight" style="display:none"></canvas>
      </div>
      <div class="page-ind" id="pageIndicator">0 / 0</div>
      <div class="arrow left" id="btnPrev">&#9664;</div>
      <div class="arrow right" id="btnNext">&#9654;</div>
      <div class="controls">
        <button id="btnPlayPause" class="btn">Pause</button>
        <button id="btnFirst" class="btn">First</button>
        <button id="btnLast" class="btn">Last</button>
      </div>
    </div>
  </div>

  <!-- Mobile buttons đặt ngoài viewer (fixed) -->
  <div class="mobile-nav" id="mobileNav" style="display:none">
    <button id="btnPrevMobile" class="mobile-btn">◀ Trang trước</button>
    <button id="btnNextMobile" class="mobile-btn">Trang sau ▶</button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

const partFiles = Array.from({length:20}, (_,i)=>`./tapsan${i+1}.pdf`);
const autoplayInterval=60000;
const canvasLeft=document.getElementById('pdfCanvasLeft'),ctxLeft=canvasLeft.getContext('2d');
const canvasRight=document.getElementById('pdfCanvasRight'),ctxRight=canvasRight.getContext('2d');
const pageIndicator=document.getElementById('pageIndicator');
const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext');
const btnPlayPause=document.getElementById('btnPlayPause'),btnFirst=document.getElementById('btnFirst'),btnLast=document.getElementById('btnLast');
const canvasWrap=document.getElementById('canvasWrap'),spread=document.getElementById('spread');
const loadingOverlay=document.getElementById('loadingOverlay');
const mobileNav=document.getElementById('mobileNav');
const btnPrevMobile=document.getElementById('btnPrevMobile');
const btnNextMobile=document.getElementById('btnNextMobile');

let pdfDocs=[],partPageCounts=[],totalPages=0,currentPage=1;
let twoPageMode=window.innerWidth>=768;
let autoplayTimer=null,autoplayEnabled=true;

// --- Zoom & Pan (giữ nguyên pan như yêu cầu) ---
let zoomLevel=1,panX=0,panY=0,isDragging=false,lastX=0,lastY=0;
let isPinching=false,pinchStartDist=0,pinchStartZoom=1,pinchCenter={x:0,y:0};

/* applyTransform / resetZoom: đảm bảo transform và trạng thái sync */
function applyTransform(){
  spread.style.transformOrigin="0 0";
  spread.style.transform=`translate(${panX}px,${panY}px) scale(${zoomLevel})`;
}
function resetZoom(){
  zoomLevel=1; panX=0; panY=0;
  // xóa transform trực tiếp để chắc chắn trạng thái mặc định
  spread.style.transform = "";
  spread.style.transformOrigin = "center center";
  // clear interaction states
  isDragging=false; isPinching=false; lastX=lastY=0; pinchStartDist=0; pinchStartZoom=1;
}

/* Adjust canvasWrap padding so page never underlap mobile-nav.
   Called whenever mobile nav visibility or size changes. */
function adjustCanvasForMobileNav(){
  if(window.innerWidth < 768 && mobileNav.style.display!=='none'){
    // lấy height thực tế của nav (fallback 100)
    const navRect = mobileNav.getBoundingClientRect();
    const pad = Math.ceil(navRect.height + 20); // thêm margin an toàn
    canvasWrap.style.paddingBottom = pad + "px";
  } else {
    canvasWrap.style.paddingBottom = "0px";
  }
}

async function loadAllPdfs(){
  let cumulative=0;
  for(let i=0;i<partFiles.length;i++){
    const doc=await pdfjsLib.getDocument(partFiles[i]).promise;
    pdfDocs.push(doc);
    partPageCounts.push(doc.numPages);
    cumulative+=doc.numPages; totalPages=cumulative;
    if(i===0){
      await renderCurrent(); updateIndicator();
      setTimeout(()=>loadingOverlay.classList.add("fade-out"),300);
    }
  }
  startAutoplay();
  updateMobileNav();
  // sau mobile nav hiển thị, điều chỉnh padding
  adjustCanvasForMobileNav();
}
function findPartAndPage(globalPage){
  let sum=0;
  for(let i=0;i<pdfDocs.length;i++){
    let count=partPageCounts[i];
    if(globalPage<=sum+count) return {part:i,page:globalPage-sum};
    sum+=count;
  } return null;
}
function resizeCanvas(canvas,viewport){
  const ratio=window.devicePixelRatio||1;
  // NOTE: canvasWrap.clientWidth/Height đã tính padding (box-sizing)
  let scale = twoPageMode ? (canvasWrap.clientHeight/viewport.height) : (canvasWrap.clientWidth/viewport.width);
  const scaled = viewport.clone({scale: scale * ratio});
  canvas.width = scaled.width; canvas.height = scaled.height;
  canvas.style.width = (scaled.width/ratio) + "px"; canvas.style.height = (scaled.height/ratio) + "px";
  return scale;
}
async function renderPage(globalPage,canvas,ctx){
  const partInfo = findPartAndPage(globalPage);
  if(!partInfo){ ctx.clearRect(0,0,canvas.width,canvas.height); return; }
  const pdfDoc = pdfDocs[partInfo.part];
  const page = await pdfDoc.getPage(partInfo.page);
  const unscaled = page.getViewport({scale:1});
  const scale = resizeCanvas(canvas, unscaled);
  const viewport = page.getViewport({scale: scale * (window.devicePixelRatio || 1)});
  await page.render({canvasContext: ctx, viewport}).promise;
}
async function renderCurrent(){
  // ensure default state before drawing (đảm bảo trang vừa render là mặc định)
  resetZoom();
  if(twoPageMode){
    canvasRight.style.display="block";
    await renderPage(currentPage, canvasLeft, ctxLeft);
    await renderPage(currentPage+1, canvasRight, ctxRight);
  } else {
    canvasRight.style.display="none";
    await renderPage(currentPage, canvasLeft, ctxLeft);
  }
  updateIndicator();
  updateMobileNav();
  adjustCanvasForMobileNav(); // recalc padding nếu cần
}

/* Indicator & navigation helpers */
function updateIndicator(){ pageIndicator.textContent = `${currentPage} / ${totalPages}`; }
function canTurnPage(){ return zoomLevel === 1; }

/* IMPORTANT: gọi resetZoom() TRƯỚC khi thay đổi currentPage để tránh giữ transform cũ */
function gotoPage(n){
  resetZoom();
  if(n<1) n=1; if(n>totalPages) n=totalPages;
  currentPage = n;
  renderCurrent();
}
function nextPage(){
  resetZoom();
  currentPage += (twoPageMode?2:1);
  if(currentPage > totalPages) currentPage = 1;
  renderCurrent();
}
function prevPage(){
  resetZoom();
  currentPage -= (twoPageMode?2:1);
  if(currentPage < 1) currentPage = (twoPageMode ? (totalPages%2==0 ? totalPages-1 : totalPages) : totalPages);
  renderCurrent();
}

/* Autoplay */
function startAutoplay(){ stopAutoplay(); if(!autoplayEnabled) return; autoplayTimer = setInterval(()=> nextPage(), autoplayInterval); }
function stopAutoplay(){ if(autoplayTimer){ clearInterval(autoplayTimer); autoplayTimer = null; } }

btnNext.addEventListener('click', ()=>{ nextPage(); pauseTemporarily(); });
btnPrev.addEventListener('click', ()=>{ prevPage(); pauseTemporarily(); });
btnPlayPause.addEventListener('click', ()=>{ autoplayEnabled = !autoplayEnabled; btnPlayPause.textContent = autoplayEnabled ? 'Pause' : 'Play'; if(autoplayEnabled) startAutoplay(); else stopAutoplay(); });
btnFirst.addEventListener('click', ()=>{ gotoPage(1); pauseTemporarily(); });
btnLast.addEventListener('click', ()=>{ gotoPage(totalPages); pauseTemporarily(); });
let resumeTimeout=null;
function pauseTemporarily(){ if(autoplayEnabled){ stopAutoplay(); if(resumeTimeout) clearTimeout(resumeTimeout); resumeTimeout = setTimeout(()=>{ if(autoplayEnabled) startAutoplay(); }, 10000); } }

/* --- Mobile buttons --- */
function updateMobileNav(){
  if(window.innerWidth < 768){
    mobileNav.style.display = "flex";
    // disable thay vì hide để layout button giữ kích thước cố định
    btnPrevMobile.disabled = currentPage <= 1;
    btnNextMobile.disabled = currentPage >= totalPages;
  } else {
    mobileNav.style.display = "none";
  }
  adjustCanvasForMobileNav();
}
btnPrevMobile.addEventListener('click', ()=>{ if(currentPage>1){ prevPage(); pauseTemporarily(); } });
btnNextMobile.addEventListener('click', ()=>{ if(currentPage<totalPages){ nextPage(); pauseTemporarily(); } });

window.addEventListener('resize', ()=>{
  twoPageMode = window.innerWidth >= 768;
  // recalculate layout and render
  renderCurrent();
  updateMobileNav();
});

/* --- PC & Mobile: zoom + pan (giữ nguyên pan) --- */
/* Wheel zoom (desktop) */
canvasWrap.addEventListener('wheel', e=>{
  if(e.ctrlKey || !twoPageMode){
    e.preventDefault();
    let rect = canvasWrap.getBoundingClientRect(), cx = e.clientX - rect.left, cy = e.clientY - rect.top;
    let oldZoom = zoomLevel, delta = e.deltaY < 0 ? 0.1 : -0.1;
    zoomLevel = Math.min(Math.max(zoomLevel + delta, 1), 4);
    panX = cx - (cx - panX) * (zoomLevel / oldZoom);
    panY = cy - (cy - panY) * (zoomLevel / oldZoom);
    if(zoomLevel === 1) resetZoom(); else applyTransform();
  }
}, {passive:false});

/* Mouse pan (desktop) */
spread.addEventListener('mousedown', e => { if(zoomLevel <= 1) return; isDragging = true; lastX = e.clientX; lastY = e.clientY; spread.style.cursor = "grabbing"; });
window.addEventListener('mouseup', ()=>{ isDragging = false; spread.style.cursor = "default"; });
window.addEventListener('mousemove', e => { if(isDragging){ panX += e.clientX - lastX; panY += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; applyTransform(); } });

/* Touch: pinch zoom + pan (mobile) - giữ lại vì bạn yêu cầu không xóa pan */
canvasWrap.addEventListener('touchstart', e=>{
  if(e.touches.length === 2){
    isPinching = true;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.sqrt(dx*dx + dy*dy);
    pinchStartZoom = zoomLevel;
    let rect = canvasWrap.getBoundingClientRect();
    pinchCenter.x = (e.touches[0].clientX + e.touches[1].clientX)/2 - rect.left;
    pinchCenter.y = (e.touches[0].clientY + e.touches[1].clientY)/2 - rect.top;
  } else if(e.touches.length === 1 && zoomLevel > 1){
    // bắt đầu pan bằng touch
    const t = e.touches[0];
    lastX = t.clientX; lastY = t.clientY;
  }
}, {passive:true});

canvasWrap.addEventListener('touchmove', e=>{
  if(isPinching && e.touches.length === 2){
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    let oldZoom = zoomLevel;
    zoomLevel = Math.min(Math.max(pinchStartZoom * (dist / pinchStartDist), 1), 4);
    panX = pinchCenter.x - (pinchCenter.x - panX) * (zoomLevel / oldZoom);
    panY = pinchCenter.y - (pinchCenter.y - panY) * (zoomLevel / oldZoom);
    if(zoomLevel === 1) resetZoom(); else applyTransform();
  } else if(e.touches.length === 1 && zoomLevel > 1){
    e.preventDefault();
    const t = e.touches[0];
    panX += t.clientX - lastX; panY += t.clientY - lastY;
    lastX = t.clientX; lastY = t.clientY;
    applyTransform();
  }
}, {passive:false});

canvasWrap.addEventListener('touchend', e=>{
  if(isPinching && e.touches.length < 2) isPinching = false;
  lastX = lastY = 0;
}, {passive:true});

/* Swipe to turn page on mobile: DISABLE swipe for page turning if zoomed
   But we still allow simple swipe when zoomLevel === 1 and user wants to turn page.
   However your previous requirement: "mobile không còn cho phép slide để chuyển trang" — 
   if you want to fully disable swipe, comment out / remove below block.
*/
let touchStartX = 0;
canvasWrap.addEventListener('touchstart', e=>{
  if(e.touches.length === 1 && canTurnPage()){
    touchStartX = e.touches[0].clientX;
    pauseTemporarily();
  }
}, {passive:true});
canvasWrap.addEventListener('touchend', e=>{
  if(!canTurnPage()) return;
  if(!e.changedTouches) return;
  let dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 30){
    if(dx < 0) nextPage(); else prevPage();
  }
}, {passive:true});

/* Start */
loadAllPdfs();

</script>
</body>
</html>
