<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TẬP SAN 20 NĂM - THPT NGUYỄN THƯỢNG HIỀN</title>
<style>
  html,body{height:100%;margin:0;font-family:Arial;background:#111;color:#fff;overflow:hidden}
  .viewer{width:100%;height:100%;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  .canvas-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .spread{display:flex;align-items:center;justify-content:center;transition:transform 0.2s ease}
  canvas{display:block;background:#000;margin:0 2px;border-radius:4px}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.4);border-radius:40px;padding:12px;cursor:pointer;z-index:10}
  .arrow.left{left:20px} .arrow.right{right:20px}
  .page-ind{position:absolute;top:10px;right:20px;color:#bbb;font-size:14px}
  .controls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  .btn{padding:6px 12px;border-radius:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);cursor:pointer;color:#fff}

  @media (max-width: 767px) {
    .controls, .arrow { display:none !important; }
  }

  #loadingOverlay {
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:#111;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:100;
    transition:opacity 0.6s ease;
  }
  #loadingOverlay.fade-out{opacity:0;pointer-events:none;}
  #loadingOverlay img{width:120px;height:auto;margin-bottom:20px;}
  .loader {
    border:6px solid #333;border-top:6px solid #09f;border-radius:50%;
    width:50px;height:50px;animation:spin 1s linear infinite;margin-bottom:15px;
  }
  @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
  .loading-text{font-size:18px;color:#ccc}
  .loading-dots::after { content:"";animation: dots 1.5s steps(3,end) infinite; }
  @keyframes dots { 0%{content:"";}33%{content:".";}66%{content:"..";}100%{content:"...";} }
</style>
</head>
<body>
  <div id="loadingOverlay">
    <img src="logo.png" alt="Logo">
    <div class="loader"></div>
    <div class="loading-text">Đang tải dữ liệu<span class="loading-dots"></span></div>
  </div>

  <div class="viewer">
    <div class="canvas-wrap" id="canvasWrap">
      <div class="spread" id="spread">
        <canvas id="pdfCanvasLeft"></canvas>
        <canvas id="pdfCanvasRight" style="display:none"></canvas>
      </div>
      <div class="page-ind" id="pageIndicator">0 / 0</div>
      <div class="arrow left" id="btnPrev">&#9664;</div>
      <div class="arrow right" id="btnNext">&#9654;</div>
      <div class="controls">
        <button id="btnPlayPause" class="btn">Pause</button>
        <button id="btnFirst" class="btn">First</button>
        <button id="btnLast" class="btn">Last</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

const pdfParts = Array.from({length:20}, (_,i)=>`tapsan${i+1}.pdf`);

const canvasLeft = document.getElementById('pdfCanvasLeft');
const ctxLeft = canvasLeft.getContext('2d');
const canvasRight = document.getElementById('pdfCanvasRight');
const ctxRight = canvasRight.getContext('2d');
const pageIndicator = document.getElementById('pageIndicator');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnPlayPause = document.getElementById('btnPlayPause');
const btnFirst = document.getElementById('btnFirst');
const btnLast = document.getElementById('btnLast');
const canvasWrap = document.getElementById('canvasWrap');
const spread = document.getElementById('spread');
const loadingOverlay = document.getElementById('loadingOverlay');

let loadedParts = new Array(pdfParts.length).fill(null);
let partPageCounts = new Array(pdfParts.length).fill(0);
let totalPagesAll = 0;
let currentPage = 1;
let twoPageMode = window.innerWidth >= 768;
let autoplayTimer=null, autoplayEnabled=true;

// ----------- Load nhanh part1, render luôn -----------
async function loadInitial(){
  const doc = await pdfjsLib.getDocument({ url: pdfParts[0] }).promise;
  loadedParts[0] = doc;
  partPageCounts[0] = doc.numPages;
  totalPagesAll = partPageCounts[0];
  // render trang đầu tiên ngay
  await renderCurrent();
  updateIndicator();
  // ẩn loading ngay khi có trang đầu
  setTimeout(()=> loadingOverlay.classList.add("fade-out"), 300);
  // load ngầm các phần còn lại
  preloadRemainingParts();
}

async function preloadRemainingParts(){
  for(let i=1;i<pdfParts.length;i++){
    const doc = await pdfjsLib.getDocument({ url: pdfParts[i] }).promise;
    loadedParts[i] = doc;
    partPageCounts[i] = doc.numPages;
    totalPagesAll = partPageCounts.reduce((a,b)=>a+b,0);
    updateIndicator();
  }
}

// ----------- Helper tìm part + trang -----------
function findPartForPage(globalPage){
  let sum=0;
  for(let i=0;i<partPageCounts.length;i++){
    const start=sum+1,end=sum+partPageCounts[i];
    if(globalPage>=start && globalPage<=end){
      return {partIndex:i,localPage:globalPage-sum};
    }
    sum+=partPageCounts[i];
  }
  return null;
}

// ----------- Render -----------
function resizeCanvas(canvas,viewport){
  const ratio=window.devicePixelRatio||1;
  let scale;
  if(twoPageMode){ scale=(canvasWrap.clientHeight)/viewport.height; }
  else { scale=(canvasWrap.clientWidth)/viewport.width; }
  const scaled=viewport.clone({scale:scale*ratio});
  canvas.width=scaled.width; canvas.height=scaled.height;
  canvas.style.width=(scaled.width/ratio)+"px";
  canvas.style.height=(scaled.height/ratio)+"px";
  return scale;
}

async function renderPage(globalPage,canvas,ctx){
  const info=findPartForPage(globalPage);
  if(!info||!loadedParts[info.partIndex]){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    return;
  }
  const page=await loadedParts[info.partIndex].getPage(info.localPage);
  const unscaled=page.getViewport({scale:1});
  const scale=resizeCanvas(canvas,unscaled);
  const viewport=page.getViewport({scale:scale*(window.devicePixelRatio||1)});
  await page.render({canvasContext:ctx,viewport}).promise;
}

async function renderCurrent(){
  if(twoPageMode){
    canvasRight.style.display="block";
    await renderPage(currentPage,canvasLeft,ctxLeft);
    await renderPage(currentPage+1,canvasRight,ctxRight);
  } else {
    canvasRight.style.display="none";
    await renderPage(currentPage,canvasLeft,ctxLeft);
  }
  updateIndicator();
}

function updateIndicator(){ pageIndicator.textContent=`${currentPage} / ${totalPagesAll}`; }

// ----------- Navigation -----------
function gotoPage(n){ if(n<1)n=1;if(n>totalPagesAll)n=totalPagesAll;currentPage=n;renderCurrent();}
function nextPage(){ currentPage+=(twoPageMode?2:1); if(currentPage>totalPagesAll) currentPage=1; renderCurrent();}
function prevPage(){ currentPage-=(twoPageMode?2:1); if(currentPage<1) currentPage=(twoPageMode?(totalPagesAll%2==0?totalPagesAll-1:totalPagesAll):totalPagesAll); renderCurrent();}

// ----------- Autoplay -----------
function startAutoplay(){ stopAutoplay(); if(!autoplayEnabled)return; autoplayTimer=setInterval(()=>nextPage(),60000); }
function stopAutoplay(){ if(autoplayTimer){clearInterval(autoplayTimer);autoplayTimer=null;} }

// ----------- Zoom / Pan -----------
let zoomLevel=1,panX=0,panY=0,isDragging=false,lastX=0,lastY=0;
function applyTransform(){ spread.style.transform=`translate(${panX}px,${panY}px) scale(${zoomLevel})`; }
function resetZoom(){ zoomLevel=1; panX=0; panY=0; applyTransform(); }

canvasWrap.addEventListener('wheel',e=>{
  if(e.ctrlKey||!twoPageMode){
    e.preventDefault();
    let delta=e.deltaY<0?0.1:-0.1;
    zoomLevel=Math.min(Math.max(zoomLevel+delta,1),4);
    applyTransform();
  }
},{passive:false});

spread.addEventListener('mousedown',e=>{
  if(zoomLevel<=1)return;
  isDragging=true; lastX=e.clientX; lastY=e.clientY; spread.style.cursor="grabbing";
});
window.addEventListener('mouseup',()=>{isDragging=false;spread.style.cursor="default";});
window.addEventListener('mousemove',e=>{
  if(isDragging){ panX+=e.clientX-lastX; panY+=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; applyTransform();}
});

// Mobile: pinch zoom + pan
let pinchStartDist=0,pinchStartZoom=1;
canvasWrap.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchStartDist=Math.sqrt(dx*dx+dy*dy);
    pinchStartZoom=zoomLevel;
  }
},{passive:true});

canvasWrap.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const dist=Math.sqrt(dx*dx+dy*dy);
    zoomLevel=Math.min(Math.max(pinchStartZoom*(dist/pinchStartDist),1),4);
    applyTransform();
  } else if(e.touches.length===1&&zoomLevel>1){
    e.preventDefault();
    const touch=e.touches[0];
    if(!lastX||!lastY){ lastX=touch.clientX; lastY=touch.clientY; return; }
    panX+=touch.clientX-lastX; panY+=touch.clientY-lastY;
    lastX=touch.clientX; lastY=touch.clientY; applyTransform();
  }
},{passive:false});

canvasWrap.addEventListener('touchend',()=>{lastX=lastY=0;if(zoomLevel<=1.01)resetZoom();});

// Double click PC / Double tap mobile
canvasWrap.addEventListener('dblclick',resetZoom);
let lastTap=0;
canvasWrap.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTap<300){resetZoom();e.preventDefault();}
  lastTap=now;
});

// ----------- Controls ----------- 
btnNext.addEventListener('click',()=>{nextPage();});
btnPrev.addEventListener('click',()=>{prevPage();});
btnPlayPause.addEventListener('click',()=>{autoplayEnabled=!autoplayEnabled;btnPlayPause.textContent=autoplayEnabled?'Pause':'Play';if(autoplayEnabled)startAutoplay();else stopAutoplay();});
btnFirst.addEventListener('click',()=>{gotoPage(1);});
btnLast.addEventListener('click',()=>{gotoPage(totalPagesAll);});

window.addEventListener('resize',()=>{twoPageMode=window.innerWidth>=768;renderCurrent();resetZoom();});

// ----------- Start -----------
loadInitial();
</script>
</body>
</html>
