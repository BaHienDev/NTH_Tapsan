<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TẬP SAN KỈ NIỆM 20 NĂM THPT NGUYỄN THƯỢNG HIỀN</title>
<style>
  html,body{height:100%;margin:0;font-family:Arial;background:#111;color:#fff;overflow:hidden}
  .viewer{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  .canvas-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .spread{display:flex;align-items:center;justify-content:center;transition:transform 0.2s ease}
  canvas{display:block;background:#000;margin:0 2px;border-radius:4px}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.4);border-radius:40px;padding:12px;cursor:pointer;z-index:10}
  .arrow.left{left:20px} .arrow.right{right:20px}
  .page-ind{position:absolute;top:10px;right:20px;color:#bbb;font-size:14px}
  .controls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  .btn{padding:6px 12px;border-radius:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);cursor:pointer;color:#fff}
  @media (max-width: 767px){ .controls, .arrow { display:none !important; } }
  #loadingOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity 0.6s ease;}
  #loadingOverlay.fade-out{opacity:0;pointer-events:none;}
  #loadingOverlay img{width:120px;margin-bottom:20px;}
  .loader{border:6px solid #333;border-top:6px solid #09f;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin-bottom:15px;}
  @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
  .loading-text{font-size:18px;color:#ccc}
  .loading-dots::after{content:"";animation:dots 1.5s steps(3,end) infinite;}
  @keyframes dots{0%{content:"";}33%{content:".";}66%{content:"..";}100%{content:"...";}}

  /* Mobile navigation (fixed, không bị zoom ảnh hưởng) */
  @media (max-width: 767px) {
    .mobile-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 200; /* cao hơn canvas */
    }
    .mobile-btn {
      padding: 10px 18px;
      border-radius: 6px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
  }
</style>
</head>
<body>
  <div id="loadingOverlay">
    <img src="logo.png" alt="Logo">
    <div class="loader"></div>
    <div class="loading-text">Đang tải dữ liệu<span class="loading-dots"></span></div>
  </div>

  <div class="viewer">
    <div class="canvas-wrap" id="canvasWrap">
      <div class="spread" id="spread">
        <canvas id="pdfCanvasLeft"></canvas>
        <canvas id="pdfCanvasRight" style="display:none"></canvas>
      </div>
      <div class="page-ind" id="pageIndicator">0 / 0</div>
      <div class="arrow left" id="btnPrev">&#9664;</div>
      <div class="arrow right" id="btnNext">&#9654;</div>
      <div class="controls">
        <button id="btnPlayPause" class="btn">Pause</button>
        <button id="btnFirst" class="btn">First</button>
        <button id="btnLast" class="btn">Last</button>
      </div>
    </div>
  </div>

  <!-- Mobile navigation đặt ngoài canvasWrap để không bị zoom -->
  <div class="mobile-nav" id="mobileNav" style="display:none">
    <button id="btnPrevMobile" class="mobile-btn">◀ Trang trước</button>
    <button id="btnNextMobile" class="mobile-btn">Trang sau ▶</button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

const partFiles = Array.from({length:20}, (_,i)=>`./tapsan${i+1}.pdf`);
const autoplayInterval=60000;
const canvasLeft=document.getElementById('pdfCanvasLeft'),ctxLeft=canvasLeft.getContext('2d');
const canvasRight=document.getElementById('pdfCanvasRight'),ctxRight=canvasRight.getContext('2d');
const pageIndicator=document.getElementById('pageIndicator');
const btnPrev=document.getElementById('btnPrev'),btnNext=document.getElementById('btnNext');
const btnPlayPause=document.getElementById('btnPlayPause'),btnFirst=document.getElementById('btnFirst'),btnLast=document.getElementById('btnLast');
const canvasWrap=document.getElementById('canvasWrap'),spread=document.getElementById('spread');
const loadingOverlay=document.getElementById('loadingOverlay');

// Mobile buttons
const mobileNav = document.getElementById('mobileNav');
const btnPrevMobile = document.getElementById('btnPrevMobile');
const btnNextMobile = document.getElementById('btnNextMobile');

let pdfDocs=[],partPageCounts=[],totalPages=0,currentPage=1;
let twoPageMode=window.innerWidth>=768;
let autoplayTimer=null,autoplayEnabled=true;

// Zoom & Pan
let zoomLevel=1,panX=0,panY=0,isDragging=false,lastX=0,lastY=0;

async function loadAllPdfs(){
  let cumulative=0;
  for(let i=0;i<partFiles.length;i++){
    const doc=await pdfjsLib.getDocument(partFiles[i]).promise;
    pdfDocs.push(doc);
    partPageCounts.push(doc.numPages);
    cumulative+=doc.numPages; totalPages=cumulative;
    if(i===0){ await renderCurrent(); updateIndicator(); setTimeout(()=>loadingOverlay.classList.add("fade-out"),300);}
  }
  startAutoplay();
  updateMobileNav();
}
function findPartAndPage(globalPage){
  let sum=0;
  for(let i=0;i<pdfDocs.length;i++){
    let count=partPageCounts[i];
    if(globalPage<=sum+count) return {part:i,page:globalPage-sum};
    sum+=count;
  } return null;
}
function resizeCanvas(canvas,viewport){
  const ratio=window.devicePixelRatio||1;
  let scale=twoPageMode?(canvasWrap.clientHeight/viewport.height):(canvasWrap.clientWidth/viewport.width);
  const scaled=viewport.clone({scale:scale*ratio});
  canvas.width=scaled.width; canvas.height=scaled.height;
  canvas.style.width=(scaled.width/ratio)+"px"; canvas.style.height=(scaled.height/ratio)+"px";
  return scale;
}
async function renderPage(globalPage,canvas,ctx){
  const partInfo=findPartAndPage(globalPage); if(!partInfo){ctx.clearRect(0,0,canvas.width,canvas.height);return;}
  const pdfDoc=pdfDocs[partInfo.part]; const page=await pdfDoc.getPage(partInfo.page);
  const unscaled=page.getViewport({scale:1}); const scale=resizeCanvas(canvas,unscaled);
  const viewport=page.getViewport({scale:scale*(window.devicePixelRatio||1)});
  await page.render({canvasContext:ctx,viewport}).promise;
}
async function renderCurrent(){
  if(twoPageMode){canvasRight.style.display="block"; await renderPage(currentPage,canvasLeft,ctxLeft); await renderPage(currentPage+1,canvasRight,ctxRight);}
  else{canvasRight.style.display="none"; await renderPage(currentPage,canvasLeft,ctxLeft);}
  resetZoom(); // đảm bảo luôn về mặc định sau khi render
  updateIndicator();
  updateMobileNav();
}
function updateIndicator(){pageIndicator.textContent=`${currentPage} / ${totalPages}`;}
function canTurnPage(){return zoomLevel===1;}
function gotoPage(n){if(n<1)n=1;if(n>totalPages)n=totalPages; currentPage=n;renderCurrent();}
function nextPage(){currentPage+=(twoPageMode?2:1); if(currentPage>totalPages)currentPage=1; renderCurrent();}
function prevPage(){currentPage-=(twoPageMode?2:1); if(currentPage<1) currentPage=(twoPageMode?(totalPages%2==0?totalPages-1:totalPages):totalPages); renderCurrent();}
function startAutoplay(){stopAutoplay(); if(!autoplayEnabled)return; autoplayTimer=setInterval(()=>nextPage(),autoplayInterval);}
function stopAutoplay(){if(autoplayTimer){clearInterval(autoplayTimer);autoplayTimer=null;}}
btnNext.addEventListener('click',()=>{nextPage();pauseTemporarily();});
btnPrev.addEventListener('click',()=>{prevPage();pauseTemporarily();});
btnPlayPause.addEventListener('click',()=>{autoplayEnabled=!autoplayEnabled;btnPlayPause.textContent=autoplayEnabled?'Pause':'Play';if(autoplayEnabled)startAutoplay();else stopAutoplay();});
btnFirst.addEventListener('click',()=>{gotoPage(1);pauseTemporarily();});
btnLast.addEventListener('click',()=>{gotoPage(totalPages);pauseTemporarily();});
let resumeTimeout=null; function pauseTemporarily(){if(autoplayEnabled){stopAutoplay();if(resumeTimeout)clearTimeout(resumeTimeout);resumeTimeout=setTimeout(()=>{if(autoplayEnabled)startAutoplay();},10000);}}

// --- Mobile navigation ---
function updateMobileNav() {
  if (window.innerWidth < 768) {
    mobileNav.style.display = "flex";
    btnPrevMobile.style.display = currentPage > 1 ? "block" : "none";
    btnNextMobile.style.display = currentPage < totalPages ? "block" : "none";
  } else {
    mobileNav.style.display = "none";
  }
}
btnPrevMobile.addEventListener('click', () => {
  if (currentPage > 1) { currentPage--; renderCurrent(); }
});
btnNextMobile.addEventListener('click', () => {
  if (currentPage < totalPages) { currentPage++; renderCurrent(); }
});

// --- Zoom & Pan ---
function applyTransform(){spread.style.transformOrigin="0 0";spread.style.transform=`translate(${panX}px,${panY}px) scale(${zoomLevel})`;}
function resetZoom(){zoomLevel=1;panX=0;panY=0;spread.style.transform="";spread.style.transformOrigin="center center";}

// PC zoom
canvasWrap.addEventListener('wheel',e=>{
  if(e.ctrlKey||!twoPageMode){
    e.preventDefault();
    let rect=canvasWrap.getBoundingClientRect(),cx=e.clientX-rect.left,cy=e.clientY-rect.top;
    let oldZoom=zoomLevel,delta=e.deltaY<0?0.1:-0.1;
    zoomLevel=Math.min(Math.max(zoomLevel+delta,1),4);
    panX=cx-(cx-panX)*(zoomLevel/oldZoom);
    panY=cy-(cy-panY)*(zoomLevel/oldZoom);
    if(zoomLevel===1)resetZoom();else applyTransform();
  }
},{passive:false});

// PC pan
spread.addEventListener('mousedown',e=>{if(zoomLevel<=1)return;isDragging=true;lastX=e.clientX;lastY=e.clientY;spread.style.cursor="grabbing";});
window.addEventListener('mouseup',()=>{isDragging=false;spread.style.cursor="default";});
window.addEventListener('mousemove',e=>{if(isDragging){panX+=e.clientX-lastX;panY+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;applyTransform();}});

// start
loadAllPdfs();
window.addEventListener('resize',()=>{twoPageMode=window.innerWidth>=768;renderCurrent();updateMobileNav();});
</script>
</body>
</html>
