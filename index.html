<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>TẬP SAN - Viewer</title>
<style>
  html,body{height:100%;margin:0;font-family:Arial;background:#111;color:#fff;overflow:hidden}
  .viewer{width:100%;height:100%;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  .canvas-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden; touch-action: none;}
  .spread{display:flex;align-items:center;justify-content:center;transition:transform 0.12s ease}
  canvas{display:block;background:#000;margin:0 2px;border-radius:4px}
  .arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.4);border-radius:40px;padding:12px;cursor:pointer;z-index:10}
  .arrow.left{left:20px} .arrow.right{right:20px}
  .page-ind{position:absolute;top:10px;right:20px;color:#bbb;font-size:14px}
  .controls{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  .btn{padding:6px 12px;border-radius:6px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);cursor:pointer;color:#fff}
  @media (max-width: 767px) { .controls, .arrow { display:none !important; } }

  /* Loading overlay */
  #loadingOverlay {
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:#111;display:flex;flex-direction:column;
    align-items:center;justify-content:center;z-index:100;
    transition:opacity 0.45s ease;
  }
  #loadingOverlay.fade-out{opacity:0;pointer-events:none;}
  #loadingOverlay img{width:120px;height:auto;margin-bottom:20px;}
  .loader { border:6px solid #333;border-top:6px solid #09f;border-radius:50%;width:50px;height:50px;animation:spin 1s linear infinite;margin-bottom:15px; }
  @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
  .loading-text{font-size:16px;color:#ccc}
  .loading-dots::after { content:"";animation: dots 1.5s steps(3,end) infinite; }
  @keyframes dots { 0%{content:"";}33%{content:".";}66%{content:"..";}100%{content:"...";} }
</style>
</head>
<body>
  <!-- Loading -->
  <div id="loadingOverlay">
    <img src="logo.png" alt="Logo">
    <div class="loader"></div>
    <div class="loading-text">Đang tải dữ liệu<span class="loading-dots"></span></div>
  </div>

  <div class="viewer">
    <div class="canvas-wrap" id="canvasWrap">
      <div class="spread" id="spread">
        <canvas id="pdfCanvasLeft"></canvas>
        <canvas id="pdfCanvasRight" style="display:none"></canvas>
      </div>
      <div class="page-ind" id="pageIndicator">0 / 0</div>
      <div class="arrow left" id="btnPrev">&#9664;</div>
      <div class="arrow right" id="btnNext">&#9654;</div>
      <div class="controls">
        <button id="btnPlayPause" class="btn">Pause</button>
        <button id="btnFirst" class="btn">First</button>
        <button id="btnLast" class="btn">Last</button>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

/* ========== CONFIG ========== */
const pdfParts = Array.from({length:20}, (_,i)=>`./tapsan${i+1}.pdf`); // tapsan1..tapsan20
const autoplayInterval = 60000;

/* ========== DOM ========== */
const canvasLeft = document.getElementById('pdfCanvasLeft');
const ctxLeft = canvasLeft.getContext('2d');
const canvasRight = document.getElementById('pdfCanvasRight');
const ctxRight = canvasRight.getContext('2d');
const canvasWrap = document.getElementById('canvasWrap');
const spread = document.getElementById('spread');
const pageIndicator = document.getElementById('pageIndicator');
const loadingOverlay = document.getElementById('loadingOverlay');

const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnPlayPause = document.getElementById('btnPlayPause');
const btnFirst = document.getElementById('btnFirst');
const btnLast = document.getElementById('btnLast');

/* ========== STATE ========== */
let pdfDocs = [];
let partPageCounts = [];
let totalPages = 0;
let currentPage = 1;

let twoPageMode = window.innerWidth >= 768;
let autoplayTimer = null, autoplayEnabled = true;

/* Touch/gesture state */
let zoomLevel = 1, panX = 0, panY = 0;
let lastX = 0, lastY = 0;
let isDragging = false;

let isPinching = false;
let pinchStartDist = 0, pinchStartZoom = 1;
let lastPinchTime = 0; // timestamp of last pinch activity
let swipeStartX = null;

/* ========== Utils ========== */
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

function applyTransform(){
  spread.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
}
function resetZoom(){
  zoomLevel = 1; panX = 0; panY = 0; applyTransform();
}

/* ========== PDF LOAD & RENDER ========== */
async function loadAllParts_fastFirst(){
  // Load first part first to show page quickly, then load others in background
  if(pdfParts.length === 0) return;
  // load part 0
  let firstDoc = await pdfjsLib.getDocument({url: pdfParts[0]}).promise;
  pdfDocs[0] = firstDoc;
  partPageCounts[0] = firstDoc.numPages;
  totalPages = partPageCounts[0];
  // render page 1 from first part immediately
  await renderCurrent();
  updateIndicator();
  // fade out loading
  setTimeout(()=> loadingOverlay.classList.add('fade-out'), 200);

  // preload remaining parts sequentially (keeps UI responsive)
  for(let i=1;i<pdfParts.length;i++){
    try{
      const doc = await pdfjsLib.getDocument({url: pdfParts[i]}).promise;
      pdfDocs[i] = doc;
      partPageCounts[i] = doc.numPages;
      totalPages = partPageCounts.reduce((a,b)=>a+b,0);
      updateIndicator();
    }catch(err){
      console.warn('Failed loading part', i, err);
    }
  }
  startAutoplay();
}

function findPartForGlobalPage(g){
  let sum = 0;
  for(let i=0;i<partPageCounts.length;i++){
    const count = partPageCounts[i] || 0;
    if(g > sum && g <= sum + count){
      return { index: i, local: g - sum };
    }
    sum += count;
  }
  return null;
}

function resizeCanvasForViewport(canvas, viewport){
  const ratio = window.devicePixelRatio || 1;
  let scale;
  if(twoPageMode){
    scale = canvasWrap.clientHeight / viewport.height;
  } else {
    scale = canvasWrap.clientWidth / viewport.width;
  }
  const scaled = viewport.clone({ scale: scale * ratio });
  canvas.width = scaled.width;
  canvas.height = scaled.height;
  canvas.style.width = (scaled.width/ratio) + 'px';
  canvas.style.height = (scaled.height/ratio) + 'px';
  return scale;
}

async function renderPage(globalPage, canvas, ctx){
  if(globalPage < 1 || globalPage > totalPages){ ctx.clearRect(0,0,canvas.width,canvas.height); return; }
  const p = findPartForGlobalPage(globalPage);
  if(!p || !pdfDocs[p.index]){ ctx.clearRect(0,0,canvas.width,canvas.height); return; }
  const page = await pdfDocs[p.index].getPage(p.local);
  const unscaled = page.getViewport({scale:1});
  const scale = resizeCanvasForViewport(canvas, unscaled);
  const viewport = page.getViewport({ scale: scale * (window.devicePixelRatio || 1) });
  await page.render({ canvasContext: ctx, viewport }).promise;
}

async function renderCurrent(){
  if(twoPageMode){
    canvasRight.style.display = 'block';
    await renderPage(currentPage, canvasLeft, ctxLeft);
    if(currentPage+1 <= totalPages) await renderPage(currentPage+1, canvasRight, ctxRight);
    else ctxRight.clearRect(0,0,canvasRight.width,canvasRight.height);
  } else {
    canvasRight.style.display = 'none';
    await renderPage(currentPage, canvasLeft, ctxLeft);
  }
  updateIndicator();
}

function updateIndicator(){
  pageIndicator.textContent = `${currentPage} / ${totalPages}`;
}

/* ========== Navigation ========== */
function gotoPage(n){ currentPage = Math.min(Math.max(1, n), totalPages); renderCurrent(); }
function nextPage(){
  currentPage += (twoPageMode?2:1);
  if(currentPage > totalPages) currentPage = 1;
  renderCurrent();
}
function prevPage(){
  currentPage -= (twoPageMode?2:1);
  if(currentPage < 1) currentPage = (twoPageMode? (totalPages%2==0?totalPages-1:totalPages) : totalPages);
  renderCurrent();
}

/* ========== Autoplay ========== */
function startAutoplay(){ stopAutoplay(); if(!autoplayEnabled) return; autoplayTimer = setInterval(()=>nextPage(), autoplayInterval); }
function stopAutoplay(){ if(autoplayTimer){ clearInterval(autoplayTimer); autoplayTimer = null; } }
btnPlayPause.addEventListener('click', ()=>{ autoplayEnabled = !autoplayEnabled; btnPlayPause.textContent = autoplayEnabled ? 'Pause':'Play'; if(autoplayEnabled) startAutoplay(); else stopAutoplay(); });

btnNext.addEventListener('click', ()=>{ nextPage(); stopAutoplayTemporarily(); });
btnPrev.addEventListener('click', ()=>{ prevPage(); stopAutoplayTemporarily(); });
btnFirst.addEventListener('click', ()=>{ gotoPage(1); stopAutoplayTemporarily(); });
btnLast.addEventListener('click', ()=>{ gotoPage(totalPages); stopAutoplayTemporarily(); });

let resumeTimeout = null;
function stopAutoplayTemporarily(){ if(autoplayEnabled){ stopAutoplay(); if(resumeTimeout) clearTimeout(resumeTimeout); resumeTimeout = setTimeout(()=>{ if(autoplayEnabled) startAutoplay(); }, 10000); } }

/* ========== Zoom & Pan (PC + Mobile) ========== */
// PC wheel zoom
canvasWrap.addEventListener('wheel', e=>{
  // if ctrlKey or on mobile it's okay, but we want to support wheel zoom when ctrlKey or not two-page
  if(e.ctrlKey || !twoPageMode){
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.12 : -0.12;
    zoomLevel = clamp(zoomLevel + delta, 1, 4);
    applyTransform();
  }
}, { passive: false });

// PC pan
spread.addEventListener('mousedown', e=>{
  if(zoomLevel <= 1) return;
  isDragging = true;
  lastX = e.clientX; lastY = e.clientY;
  spread.style.cursor = 'grabbing';
});
window.addEventListener('mouseup', ()=>{ isDragging = false; spread.style.cursor = 'default'; });
window.addEventListener('mousemove', e=>{
  if(isDragging){
    panX += e.clientX - lastX; panY += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    applyTransform();
  }
});

/* ========== Unified touch handlers for mobile (pinch/pan/swipe logic) ========== */
canvasWrap.addEventListener('touchstart', function(e){
  // if two finger -> start pinch
  if(e.touches.length === 2){
    isPinching = true;
    pinchStartDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    pinchStartZoom = zoomLevel;
    swipeStartX = null; // cancel swipe
  } else if(e.touches.length === 1){
    const t = e.touches[0];
    if(zoomLevel === 1 && (Date.now() - lastPinchTime > 400)){
      // allow swipe start only if not just pinched
      swipeStartX = t.clientX;
    } else if(zoomLevel > 1){
      // initiate pan by single finger when zoomed
      lastX = t.clientX; lastY = t.clientY;
      swipeStartX = null;
    } else {
      swipeStartX = null;
    }
  }
}, { passive: true });

canvasWrap.addEventListener('touchmove', function(e){
  if(e.touches.length === 2){
    // pinch zoom
    e.preventDefault(); // prevent browser pinch
    isPinching = true;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx, dy);
    if(pinchStartDist > 0){
      zoomLevel = clamp(pinchStartZoom * (dist / pinchStartDist), 1, 4);
      applyTransform();
      lastPinchTime = Date.now();
    }
  } else if(e.touches.length === 1 && zoomLevel > 1){
    // pan with one finger when zoomed
    e.preventDefault();
    const t = e.touches[0];
    if(lastX === 0 && lastY === 0){ lastX = t.clientX; lastY = t.clientY; return; }
    panX += t.clientX - lastX;
    panY += t.clientY - lastY;
    lastX = t.clientX; lastY = t.clientY;
    applyTransform();
  }
}, { passive: false });

canvasWrap.addEventListener('touchend', function(e){
  // update timers/flags
  const now = Date.now();

  // if a pinch just ended (was pinching and now touches < 2)
  if(isPinching && e.touches.length < 2){
    isPinching = false;
    lastPinchTime = now;
    // if one finger remains, prepare for pan by setting lastX/lastY
    if(e.touches.length === 1){
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    } else {
      lastX = lastY = 0;
    }
    // DO NOT reset zoom automatically; keep current zoomLevel
  }

  // Swipe detection: only if NOT recently pinched and zoomLevel === 1
  if(zoomLevel === 1 && (now - lastPinchTime > 400) && swipeStartX !== null && e.changedTouches && e.changedTouches.length === 1){
    const dx = e.changedTouches[0].clientX - swipeStartX;
    swipeStartX = null;
    if(Math.abs(dx) > 30){
      if(dx < 0) nextPage();
      else prevPage();
    }
  } else {
    swipeStartX = null;
  }

  // reset lastX/lastY only if no touching remains and not zoomed (we keep for pan if zoom>1)
  if(e.touches.length === 0){
    if(zoomLevel <= 1.01){
      lastX = lastY = 0;
      // do not auto-reset zoom here (user wanted to keep zoom until double-tap)
      // resetZoom(); // <-- intentionally omitted
    } else {
      // keep pan state so user can continue panning on next touch
      lastX = lastY = 0;
    }
  }
}, { passive: true });

/* Double-tap reset (explicit) */
let lastTap = 0;
canvasWrap.addEventListener('touchend', function(e){
  const now = Date.now();
  if(now - lastTap < 300){
    resetZoom();
    e.preventDefault();
  }
  lastTap = now;
}, { passive: true });

canvasWrap.addEventListener('dblclick', resetZoom);

/* ========== Resize handler ========== */
window.addEventListener('resize', ()=>{
  twoPageMode = window.innerWidth >= 768;
  renderCurrent();
  resetZoom();
});

/* ========== Start loading ========== */
loadAllParts_fastFirst();

</script>
</body>
</html>
