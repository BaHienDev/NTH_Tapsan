<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tập san Flipbook</title>

<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    background: #111;
    overflow: hidden;
  }

  #flipbook {
    width: 100%; height: 100%;
  }

  #flipbook .page {
    width: 100%; height: 100%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #flipbook img {
    width: 100%;
    height: 100%;
    object-fit: contain; /* đảm bảo không bị cắt ngang */
  }

  /* Nút điều khiển trên PC */
  .controls {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 100;
  }
  .btn {
    padding: 6px 12px;
    border-radius: 6px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.3);
    cursor: pointer;
    color: #fff;
  }

  /* Ẩn controls trên mobile */
  @media (max-width: 767px) {
    .controls {
      display: none !important;
    }
  }
</style>

<!-- jQuery + Turn.js -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/blasten/turn.js/turn.min.js"></script>

<!-- PDF.js -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
</head>
<body>

<div id="flipbook"></div>

<!-- Controls chỉ hiện trên PC -->
<div class="controls">
  <button id="btnPrev" class="btn">Prev</button>
  <button id="btnNext" class="btn">Next</button>
  <button id="btnFirst" class="btn">First</button>
  <button id="btnLast" class="btn">Last</button>
</div>

<script>
const pdfUrl = "./tapsan-29-9-25.pdf"; 

pdfjsLib.GlobalWorkerOptions.workerSrc =
 "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

async function loadPdfAsImages() {
  const pdf = await pdfjsLib.getDocument(pdfUrl).promise;
  const totalPages = pdf.numPages;

  const flipbook = $("#flipbook");

  for (let i = 1; i <= totalPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 2 });
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: ctx, viewport }).promise;

    const img = document.createElement("img");
    img.src = canvas.toDataURL("image/jpeg", 0.9);

    const pageDiv = document.createElement("div");
    pageDiv.className = "page";
    pageDiv.appendChild(img);

    flipbook.append(pageDiv);
  }

  initFlipbook(totalPages);
}

function initFlipbook(totalPages) {
  $("#flipbook").turn({
    width: window.innerWidth,
    height: window.innerHeight,
    autoCenter: true,
    display: window.innerWidth >= 768 ? "double" : "single", // PC = 2 trang, Mobile = 1 trang
    gradients: true,
    acceleration: true
  });

  // Resize khi xoay màn hình
  window.addEventListener("resize", () => {
    $("#flipbook").turn("size", window.innerWidth, window.innerHeight);
    $("#flipbook").turn("display", window.innerWidth >= 768 ? "double" : "single");
  });

  // Controls cho PC
  document.getElementById("btnPrev").onclick = () => $("#flipbook").turn("previous");
  document.getElementById("btnNext").onclick = () => $("#flipbook").turn("next");
  document.getElementById("btnFirst").onclick = () => $("#flipbook").turn("page", 1);
  document.getElementById("btnLast").onclick = () => $("#flipbook").turn("page", totalPages);
}

loadPdfAsImages();
</script>
</body>
</html>
